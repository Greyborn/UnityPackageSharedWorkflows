# Releases and publishes a Greyborn UPM package. Called from each package
# repository's own workflow; see README.md for the caller workflow.
#
# RELEASE
#   Commit messages since the last release tag are examined using Conventional
#   Commits syntax. `feat`, `fix`, and breaking changes trigger a release; all
#   other types are ignored. When a release is needed, the version in
#   package.json is bumped, CHANGELOG.md and README.md are regenerated, the
#   AssemblyFileVersion in AssemblyInfo.cs files is updated, the changes are
#   committed, tagged, and pushed, and a GitHub release is created.
#
# PUBLISH
#   If the registry doesn't have the version in package.json yet, that version
#   is published. This normally happens right after a release, but it also lets
#   a release whose publish step failed be published by running the workflow
#   again, without a new commit.

name: UPM Release

on:
  workflow_call:
    inputs:
      registry:
        description: URL of the npm registry the package is published to.
        required: true
        type: string
      registry_username:
        description: Name of the registry account used to publish the package.
        required: true
        type: string
    secrets:
      registry_password:
        description: Password of the registry account used to publish the package.
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release and publish
    runs-on: ubuntu-24.04
    concurrency:
      group: upm-release-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Release
        id: version
        uses: Greyborn/UnityPackageSharedWorkflows/actions/upm-version@v1

      - name: Create GitHub release
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ steps.version.outputs.notes }}
        run: gh release create "$TAG" --title "$TAG" --notes "$NOTES" --verify-tag

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: ${{ inputs.registry }}

      - name: Publish package
        env:
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USERNAME: ${{ inputs.registry_username }}
          REGISTRY_PASSWORD: ${{ secrets.registry_password }}
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)

          # Log in through the registry's npm user API, which returns an auth token.
          # Verdaccio only logs in an existing user when the request is also
          # authenticated with that user's name and password (HTTP Basic);
          # otherwise it tries to create the user and fails with 409 Conflict.
          token=$(jq -n --arg name "$REGISTRY_USERNAME" --arg password "$REGISTRY_PASSWORD" '{name: $name, password: $password}' \
            | curl --fail --silent --show-error --request PUT \
                --user "$REGISTRY_USERNAME:$REGISTRY_PASSWORD" \
                --header 'Content-Type: application/json' --data @- \
                "${REGISTRY%/}/-/user/org.couchdb.user:${REGISTRY_USERNAME}" \
            | jq -r '.token // empty')

          if [ -z "$token" ]; then
            echo "::error::Logging in to $REGISTRY as $REGISTRY_USERNAME did not return a token."
            exit 1
          fi
          echo "::add-mask::$token"
          export NODE_AUTH_TOKEN="$token"

          published=$(npm view "$name@$version" version --registry "$REGISTRY" 2>/dev/null || true)
          if [ "$published" = "$version" ]; then
            echo "$name@$version is already published; nothing to do."
            exit 0
          fi

          npm publish --registry "$REGISTRY"
